name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const row = k => `| ${k} | ${s[k].pct}% (${s[k].covered}/${s[k].total}) |`;
            console.log(["| Metric | Coverage |", "|---|---|", ...["lines","statements","functions","branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      # There is no compiled artifact (the harness runs from source via tsx); "build" checks the CLI loads.
      - name: Build (CLI smoke)
        run: pnpm harness --help

  links:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress './*.md' './docs/**/*.html' './.github/**/*.md'
          fail: true

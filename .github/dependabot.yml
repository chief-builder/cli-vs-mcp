version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # Experiment subject: upgrading changes what is measured. Bump together with a new run.
      - dependency-name: '@playwright/cli'
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep in step with the pinned Node major (.nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
